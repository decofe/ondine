<!doctype html>
<meta charset="utf-8" />
<script type="module">
  // A major pentatonic, the notes shared by the soundtrack's F# minor bass line and its relative A major.
  const scale = [1760, 1975.5, 2217.5, 2637, 2960, 3520, 3951, 4435]

  function env(ctx, node, t, peak, decay) {
    const g = ctx.createGain()
    // Silent until the envelope starts, since a gain param holds its default of 1 before its first event.
    g.gain.value = 0.0001
    g.gain.setValueAtTime(0.0001, t)
    g.gain.exponentialRampToValueAtTime(peak, t + 0.004)
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay)
    node.connect(g)
    return g
  }

  function pan(ctx, node, value) {
    const p = ctx.createStereoPanner()
    p.pan.value = value
    node.connect(p)
    return p
  }

  // Plump bubble: a sine that falls an octave in 60 ms, with a short triangle overtone.
  function pop(ctx, out, t, note, side) {
    const f = scale[note % scale.length] / 2
    const o = ctx.createOscillator()
    o.frequency.setValueAtTime(f * 2, t)
    o.frequency.exponentialRampToValueAtTime(f, t + 0.06)
    const o2 = ctx.createOscillator()
    o2.type = 'triangle'
    o2.frequency.setValueAtTime(f * 4, t)
    o2.frequency.exponentialRampToValueAtTime(f * 2, t + 0.04)
    pan(ctx, env(ctx, o, t, 2.4, 0.22), side).connect(out)
    pan(ctx, env(ctx, o2, t, 0.5, 0.07), side).connect(out)
    for (const x of [o, o2]) {
      x.start(t)
      x.stop(t + 0.3)
    }
  }

  // Bright two-note bell for a passing check.
  function plink(ctx, out, t) {
    ;[
      [1318.5, 0],
      [1760, 0.07],
    ].forEach(([f, d]) => {
      const o = ctx.createOscillator()
      o.frequency.value = f
      const m = ctx.createOscillator()
      m.frequency.value = f * 2
      const mg = ctx.createGain()
      mg.gain.value = f * 0.6
      m.connect(mg).connect(o.frequency)
      env(ctx, o, t + d, 0.6, 0.35).connect(out)
      for (const x of [o, m]) {
        x.start(t + d)
        x.stop(t + d + 0.5)
      }
    })
  }

  window.encode = () => {
    const chunks = [[window.buffer.getChannelData(0)], [window.buffer.getChannelData(1)]]
    const len = window.buffer.length
    const out = new DataView(new ArrayBuffer(44 + len * 4))
    const w = (o, s) => [...s].forEach((ch, i) => out.setUint8(o + i, ch.charCodeAt(0)))
    w(0, 'RIFF')
    out.setUint32(4, 36 + len * 4, true)
    w(8, 'WAVEfmt ')
    out.setUint32(16, 16, true)
    out.setUint16(20, 1, true)
    out.setUint16(22, 2, true)
    out.setUint32(24, window.buffer.sampleRate, true)
    out.setUint32(28, window.buffer.sampleRate * 4, true)
    out.setUint16(32, 4, true)
    out.setUint16(34, 16, true)
    w(36, 'data')
    out.setUint32(40, len * 4, true)
    let o = 44
    for (let k = 0; k < chunks[0].length; k++) {
      const l = chunks[0][k],
        r = chunks[1][k]
      for (let i = 0; i < l.length; i++) {
        out.setInt16(o, Math.max(-1, Math.min(1, l[i])) * 32767, true)
        out.setInt16(o + 2, Math.max(-1, Math.min(1, r[i])) * 32767, true)
        o += 4
      }
    }
    let bin = ''
    const bytes = new Uint8Array(out.buffer)
    for (let i = 0; i < bytes.length; i += 0x8000)
      bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000))
    return btoa(bin)
  }

  // Cute typing: tiny pitched blips, a random note of the scale every `step` seconds, as characters appear.
  let typingSeed = 11
  const random = () => (typingSeed = (typingSeed * 16807) % 2147483647) / 2147483647
  function typing(ctx, out, t, _note, _side, length, step) {
    const count = Math.max(1, Math.round(length / step))
    for (let k = 0; k < count; k++) {
      const at = t + k * step
      const f = scale[Math.floor(random() * 5)]
      const o = ctx.createOscillator()
      o.type = 'sine'
      o.frequency.setValueAtTime(f * 1.12, at)
      o.frequency.exponentialRampToValueAtTime(f, at + 0.025)
      const o2 = ctx.createOscillator()
      o2.type = 'triangle'
      o2.frequency.setValueAtTime(f * 2, at)
      env(ctx, o, at, 0.32 + random() * 0.12, 0.07).connect(out)
      env(ctx, o2, at, 0.05, 0.03).connect(out)
      for (const x of [o, o2]) {
        x.start(at)
        x.stop(at + 0.12)
      }
    }
  }

  // Soft whoosh: noise through a rising band-pass that fades in over `length` and tails off.
  function swell(ctx, out, t, _note, _side, length) {
    const seconds = length + 0.35
    const noise = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * seconds), ctx.sampleRate)
    const data = noise.getChannelData(0)
    for (let i = 0; i < data.length; i++) data[i] = random() * 2 - 1
    const source = ctx.createBufferSource()
    source.buffer = noise
    const band = ctx.createBiquadFilter()
    band.type = 'bandpass'
    band.Q.value = 1.2
    band.frequency.setValueAtTime(500, t)
    band.frequency.exponentialRampToValueAtTime(4000, t + length)
    const g = ctx.createGain()
    g.gain.value = 0.0001
    g.gain.setValueAtTime(0.0001, t)
    g.gain.exponentialRampToValueAtTime(0.5, t + length * 0.85)
    g.gain.exponentialRampToValueAtTime(0.0001, t + seconds)
    source.connect(band).connect(g).connect(out)
    source.start(t)
    source.stop(t + seconds)
  }

  const kinds = { plink, pop, swell, typing }

  window.render = async (events, seconds) => {
    const ctx = new OfflineAudioContext(2, 48000 * seconds, 48000)
    const out = ctx.createGain()
    out.connect(ctx.destination)
    events.forEach((e, i) =>
      kinds[e.kind](
        ctx,
        out,
        e.time,
        e.note ?? i,
        ((i % 5) - 2) * 0.12,
        e.length ?? 0,
        e.step ?? 0,
      ),
    )
    window.buffer = await ctx.startRendering()
  }
</script>
