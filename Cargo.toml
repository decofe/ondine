[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/wevm/melee"
rust-version = "1.97.0"
version = "0.0.0"

[workspace.dependencies]
compiler = { path = "crates/compiler", default-features = false }
insta = "1"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
iter_over_hash_type = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
similar_names = "allow"
todo = "warn"
too_many_lines = "allow"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package.insta]
opt-level = 3

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
strip = "symbols"

# Diagram modules inline into browser bundles, so they trade peak speed for size.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
