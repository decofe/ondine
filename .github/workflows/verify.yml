name: Verify
on:
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check code
        run: pnpm check

      - name: Build WebAssembly
        run: pnpm build:wasm

      - name: Check generated exports
        run: git diff --exit-code package.json

      - name: Check types
        run: pnpm check:types

  packed:
    name: Test Packed
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install toolchain
        run: rustup show

      - name: Install size toolchain
        run: rustup toolchain install nightly-2026-06-29 --profile minimal --component rust-src --target wasm32-unknown-unknown

      - name: Run packed-consumer test
        run: pnpm test:packed

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show

      - name: Install size toolchain
        run: rustup toolchain install nightly-2026-06-29 --profile minimal --component rust-src --target wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  test:
    name: Test Runtime
    # Playwright 1.56.1, pinned to the Chromium the screenshot baselines were captured in, installs
    # its browser dependencies only up to Ubuntu 24.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install toolchain
        run: rustup show

      - name: Install size toolchain
        run: rustup toolchain install nightly-2026-06-29 --profile minimal --component rust-src --target wasm32-unknown-unknown

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm run test --bail=1
        env:
          CI: true

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: screenshot-diffs
          path: .vitest-attachments
