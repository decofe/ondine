name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: verify-${{ github.event.pull_request.number || github.ref }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: node scripts/theme.ts && git diff --exit-code -- themes
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked && cargo test --release --workspace --locked
      - run: pnpm build && pnpm check:size && pnpm test && pnpm check:parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-and-size
          path: bench/results/
