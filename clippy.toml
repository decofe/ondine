doc-valid-idents = ["JavaScript", "TypeScript", "WebAssembly", ".."]
disallowed-methods = [
  { path = "std::env::var", reason = "The compiler reads no environment. Hosts pass options." },
  { path = "std::fs::read", reason = "The compiler reads no files. Hosts supply source text." },
  { path = "std::fs::read_to_string", reason = "The compiler reads no files. Hosts supply source text." },
  { path = "std::fs::write", reason = "The compiler writes no files. Hosts publish output." },
  { path = "std::time::Instant::now", reason = "Output never depends on the clock." },
  { path = "std::time::SystemTime::now", reason = "Output never depends on the clock." },
  { path = "str::replace", reason = "Allocates in hot paths. Scan and push into the output buffer." },
  { path = "str::to_lowercase", reason = "Allocates in hot paths. Compare with eq_ignore_ascii_case." },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "Use an insertion-ordered structure or a Vec arena." },
  { path = "std::collections::HashSet", reason = "Use an insertion-ordered structure or a Vec arena." },
]
